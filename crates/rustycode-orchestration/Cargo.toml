[package]
name = "rustycode-orchestration"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tiered model orchestration for terminal-bench and complex task solving"

[features]
default = []
slow-tests = []

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bincode.workspace = true
chrono = { workspace = true, features = ["serde"] }
dashmap.workspace = true
dirs.workspace = true
fs2 = "0.4"
futures.workspace = true
parking_lot.workspace = true
handlebars.workspace = true
jsonschema.workspace = true
once_cell.workspace = true
rand.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustycode-llm = { path = "../rustycode-llm" }
rustycode-protocol = { path = "../rustycode-protocol" }
rustycode-agent-runtime = { path = "../rustycode-agent-runtime" }
rustycode-executable = { path = "../rustycode-executable" }
rustycode-skill = { path = "../rustycode-skill" }
rustycode-tools = { path = "../rustycode-tools", default-features = false }
rustycode-tools-api = { path = "../rustycode-tools-api" }
rustycode-tools-security = { path = "../rustycode-tools-security" }
rustycode-storage = { path = "../rustycode-storage" }
rustycode-prompt = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
