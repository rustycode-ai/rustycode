[package]
name = "rustycode-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
once_cell.workspace = true
glob = "0.3"
handlebars.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
similar = "3.1"
thiserror.workspace = true
walkdir.workspace = true
ignore.workspace = true
shell-words.workspace = true
html2md = "0.2"
chromiumoxide.workspace = true
futures.workspace = true
notify = "8.0"
rustycode-tools-api = { path = "../rustycode-tools-api" }
rustycode-tools-security = { path = "../rustycode-tools-security" }
rustycode-executable = { path = "../rustycode-executable" }
async-trait.workspace = true
rustycode-config = { path = "../rustycode-config" }
rustycode-lsp = { path = "../rustycode-lsp" }
rustycode-protocol = { path = "../rustycode-protocol" }
rustycode-bus = { path = "../rustycode-bus" }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
lsp-types.workspace = true
rustycode-shared-runtime = { path = "../rustycode-shared-runtime" }
rustycode-thread-guard = { path = "../rustycode-thread-guard" }
rustycode-storage = { path = "../rustycode-storage" }
rustycode-tool-integration = { path = "../rustycode-tool-integration" }
rustycode-sandbox = { workspace = true }
rustycode-vector-memory = { path = "../rustycode-vector-memory", optional = true }
reqwest = { workspace = true }
lru.workspace = true
parking_lot.workspace = true
uuid.workspace = true
urlencoding.workspace = true
ahash = "0.8"
dashmap.workspace = true
dirs.workspace = true
shellexpand.workspace = true
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-scala = "0.26"
sha2.workspace = true
url = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
schemars = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }

[features]
default = ["sandbox", "llm-cost-tracking"]
sandbox = []
vector-memory = ["dep:rustycode-vector-memory"]
llm-cost-tracking = []
worktree = []

[dev-dependencies]
tempfile.workspace = true
rustycode-session = { path = "../rustycode-session" }
rustycode-runtime = { path = "../rustycode-runtime" }


# Note: sandbox_benchmarks and sandbox_performance will be added when implemented

# Lints specified locally instead of workspace = true because this crate needs
# unsafe_code = "allow" for Linux subprocess management (prctl/PR_SET_PDEATHSIG).
# Cargo does not allow mixing `workspace = true` with per-lint overrides.
[lints.rust]
unsafe_code = "allow"
dead_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
uninlined_format_args = "allow"
type_complexity = "allow"
collapsible-match = "allow"
unnecessary-sort-by = "allow"
unnecessary-min-or-max = "allow"
useless-conversion = "allow"
needless_range_loop = "allow"
await_holding_lock = "allow"
upper_case_acronyms = "allow"
too_many_arguments = "allow"
string_slice = "allow"
redundant_field_names = "allow"
module_inception = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
suboptimal_flops = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"


