[package]
name = "rustycode-guard"
version = "0.1.0"
edition = "2021"
authors = ["RustyCode"]
license = "MIT"
description = "Standalone guardrail binary for hook-based security enforcement"
repository = "https://github.com/luengnat/rustycode"

[lib]
name = "rustycode_guard"
path = "src/lib.rs"

[[bin]]
name = "rustycode-guard"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
regex.workspace = true
tracing.workspace = true
rustycode-protocol = { path = "../rustycode-protocol" }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true

