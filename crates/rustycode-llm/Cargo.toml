[package]
name = "rustycode-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
rustycode-protocol = { path = "../rustycode-protocol" }
rustycode-config = { path = "../rustycode-config" }
rustycode-auth = { path = "../rustycode-auth" }
rustycode-tools = { path = "../rustycode-tools", default-features = false }
rustycode-tools-api = { path = "../rustycode-tools-api" }
rustycode-tool-integration = { path = "../rustycode-tool-integration" }
async-trait.workspace = true
tokio-stream = "0.1"
thiserror.workspace = true
secrecy.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
uuid = { workspace = true }
sha2 = { workspace = true }
once_cell = { workspace = true }
rustycode-litert = { path = "../rustycode-litert", optional = true }

[features]
default = ["litert"]
# Enable live API integration tests (requires provider API keys, network access)
live-api-tests = []
# Enable vector memory integration (semantic search, auto-routing)
vector-memory = []
# Enable LiteRT-LM local inference provider
litert = ["dep:rustycode-litert"]

[lints]
workspace = true
