[package]
name = "rustycode-vector-memory"
version = "0.1.0"
edition = "2021"
description = "Vector-based memory system for rustycode agents with semantic search"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
fastembed = { version = "5", optional = true }

[features]
default = ["embedding"]
embedding = ["fastembed"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

