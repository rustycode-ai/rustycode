[package]
name = "rustycode-executable"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
criterion.workspace = true

[[bench]]
name = "defer_loading_bench"
harness = false

[lints]
workspace = true
