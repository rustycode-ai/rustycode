[package]
name = "rustycode-ui-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { workspace = true, features = ["v4"] }
rustycode-protocol = { path = "../rustycode-protocol", optional = true }

[features]
default = []
accumulator = ["rustycode-protocol"]

[lints]
workspace = true
