[package]
name = "rustycode-ws-server"
version = "0.5.3"
edition = "2021"
license = "MIT"

[dependencies]
axum.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokio-util.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }

rustycode-protocol = { path = "../rustycode-protocol" }
rustycode-ui-model = { path = "../rustycode-ui-model", features = ["accumulator"] }
rustycode-bus = { path = "../rustycode-bus" }
rustycode-orchestration = { path = "../rustycode-orchestration" }
rustycode-llm = { path = "../rustycode-llm" }
rustycode-tools = { path = "../rustycode-tools" }
rustycode-skill = { path = "../rustycode-skill" }
rustycode-mcp = { path = "../rustycode-mcp" }
anyhow.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.26"
tower = "0.5"
http-body-util = "0.1"

[lints]
workspace = true
