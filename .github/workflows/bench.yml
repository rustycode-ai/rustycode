name: Benchmarks

# Runs on the release repo; checks out source from the private dev repo via PAT.
# Manual dispatch only (no PR/push/schedule) to keep token usage opt-in.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Dev-repo branch/tag to benchmark"
        default: "main"

permissions:
  contents: read

env:
  DEV_REPO: luengnat/rustycode

defaults:
  run:
    working-directory: dev-repo

concurrency:
  group: bench-${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Bench Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Validate benchmark manifest
        run: ./scripts/validate-benchmarks.sh

  compile:
    name: Compile Benches
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev-repo
          shared-key: benches

      - name: Build benchmark targets
        run: cargo bench --bench tui_performance --no-run --locked

  full:
    name: Full Benchmark Run
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev-repo
          shared-key: full-bench

      - name: Run benchmark suite
        run: ./scripts/bench.sh main

      - name: Upload criterion reports
        uses: actions/upload-artifact@v5
        with:
          name: criterion-results
          path: dev-repo/target/criterion
          retention-days: 30
