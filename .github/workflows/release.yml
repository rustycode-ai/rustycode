name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        default: 'main'
      release_type:
        description: 'nightly or stable'
        type: choice
        options: [nightly, stable]
        default: stable

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: rustycode-linux-x64
            exe_ext: ''
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_name: rustycode-linux-arm64
            exe_ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustycode-windows-x64
            exe_ext: '.exe'
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: rustycode-macos-arm64
            exe_ext: ''
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: rustycode-macos-x64
            exe_ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout from private repo
        uses: actions/checkout@v4
        with:
          repository: luengnat/rustycode
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libssl-dev pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxft-dev libxext-dev \
            gcc-aarch64-linux-gnu \
            perl

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --yes
          Invoke-WebRequest -Uri https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip -OutFile protoc.zip
          Expand-Archive -Path protoc.zip -DestinationPath C:\protoc
          echo "C:\protocin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          echo "C:\Strawberry\perlin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          echo "PERL=C:\Strawberry\perlin\perl.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure Linux ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        env:
          OPENSSL_DIR: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/openssl@3' || '' }}
        run: cargo build --release --target ${{ matrix.target }} -p rustycode-cli

      - name: Verify
        shell: bash
        run: |
          CLI="target/${{ matrix.target }}/release/rustycode${{ matrix.exe_ext }}"
          [ -f "$CLI" ] || { echo "::error::binary not found at $CLI"; exit 1; }

      - name: Package
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/rustycode${{ matrix.exe_ext }}" "artifacts/${{ matrix.artifact_name }}/"
          cd artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}/"
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}/"
          fi
          ls -lh

      - name: Test
        shell: bash
        run: |
          CLI="target/${{ matrix.target }}/release/rustycode${{ matrix.exe_ext }}"
          "$CLI" --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metadata
        id: meta
        run: |
          REF="${{ github.event.inputs.ref || 'main' }}"
          TYPE="${{ github.event.inputs.release_type || 'stable' }}"
          if [ "$TYPE" = "stable" ]; then
            echo "tag=${REF}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=RustyCode ${REF}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y-%m-%d)
            echo "tag=nightly-${DATE}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=RustyCode Nightly ${DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
