name: Build Release Binaries

on:
  repository_dispatch:
    types: [trigger-nightly, trigger-release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        default: 'main'
      release_type:
        description: 'nightly or stable'
        type: choice
        options: [nightly, stable]
        default: nightly

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: rustycode-linux-x64
            exe_ext: ''
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_name: rustycode-linux-arm64
            exe_ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustycode-windows-x64
            exe_ext: '.exe'
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: rustycode-macos-arm64
            exe_ext: ''
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: rustycode-macos-x64
            exe_ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout from private repo
        uses: actions/checkout@v4
        with:
          repository: luengnat/rustycode
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxft-dev libxext-dev \
            gcc-aarch64-linux-gnu \
            perl

      - name: Configure Linux ARM64 cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p rustycode-cli
          cargo build --release --target ${{ matrix.target }} -p rustycode-tui

      - name: Verify binaries exist
        shell: bash
        run: |
          CLI="target/${{ matrix.target }}/release/rustycode-cli${{ matrix.exe_ext }}"
          if [ ! -f "$CLI" ]; then
            echo "::error::CLI binary not found at $CLI"
            exit 1
          fi

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/rustycode-cli${{ matrix.exe_ext }}" "artifacts/${{ matrix.artifact_name }}/"
          if [ -f "target/${{ matrix.target }}/release/rustycode-tui${{ matrix.exe_ext }}" ]; then
            cp "target/${{ matrix.target }}/release/rustycode-tui${{ matrix.exe_ext }}" "artifacts/${{ matrix.artifact_name }}/"
          fi
          cd artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ matrix.artifact_name }}.zip" "${{ matrix.artifact_name }}/"
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}/"
          fi
          ls -lh

      - name: Test binary
        shell: bash
        run: |
          CLI="target/${{ matrix.target }}/release/rustycode-cli${{ matrix.exe_ext }}"
          "$CLI" --version || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release metadata
        id: meta
        run: |
          EVENT="${{ github.event.action }}"
          INPUT_TYPE="${{ github.event.inputs.release_type }}"
          REF="${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}"

          if [ "$EVENT" = "trigger-release" ] || [ "$INPUT_TYPE" = "stable" ]; then
            echo "tag=${REF}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=RustyCode ${REF}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y-%m-%d)
            echo "tag=nightly-${DATE}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=RustyCode Nightly ${DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
