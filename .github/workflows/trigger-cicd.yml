name: Trigger CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build'
        required: true
        default: 'main'
      event_type:
        description: 'What to trigger'
        type: choice
        options: [auto, ci, nightly, release]
        default: auto

jobs:
  trigger-ci:
    if: |
      github.repository == 'luengnat/rustycode' && (
        (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.event_type == 'ci' ||
          (github.event.inputs.event_type == 'auto' && !startsWith(github.event.inputs.ref, 'v'))
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CI on release repo
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "Triggering CI for ref: ${{ steps.config.outputs.ref }}"
          gh api repos/rustycode-ai/rustycode/dispatches \
            -X POST \
            -f event_type=trigger-ci \
            -f "client_payload[ref]=${{ steps.config.outputs.ref }}"

  trigger-release:
    if: |
      github.repository == 'luengnat/rustycode' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.event_type == 'release' ||
          (github.event.inputs.event_type == 'auto' && startsWith(github.event.inputs.ref, 'v'))
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Determine ref
        id: config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger release on release repo
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "Triggering stable release for ref: ${{ steps.config.outputs.ref }}"
          gh api repos/rustycode-ai/rustycode/actions/workflows/release.yml/dispatches \
            -X POST \
            -f "ref=${{ steps.config.outputs.ref }}" \
            -f "release_type=stable"

  trigger-nightly:
    if: |
      github.repository == 'luengnat/rustycode' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.event_type == 'nightly')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nightly on release repo
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          echo "Triggering nightly release for main"
          gh api repos/rustycode-ai/rustycode/actions/workflows/release.yml/dispatches \
            -X POST \
            -f "ref=main" \
            -f "release_type=nightly"
