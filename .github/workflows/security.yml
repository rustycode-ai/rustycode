name: Security Scan

# Runs on the release repo; checks out source from the private dev repo via PAT.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Dev-repo branch/tag to scan"
        default: "main"

permissions:
  contents: read
  security-events: write

env:
  DEV_REPO: luengnat/rustycode

defaults:
  run:
    working-directory: dev-repo

concurrency:
  group: security-${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.21.2_linux_x64.tar.gz

      - name: Run gitleaks (full history)
        continue-on-error: true
        run: |
          echo "=== Running gitleaks on full history ==="
          gitleaks detect --source . --verbose --report-format sarif --report-path gitleaks-results.sarif || true

      - name: Run gitleaks (unstaged changes)
        run: |
          echo "=== Running gitleaks on unstaged changes ==="
          gitleaks protect --source . --verbose --staged || true

      - name: Upload gitleaks results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dev-repo/gitleaks-results.sarif
          category: gitleaks

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev-repo
          shared-key: security-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Update advisory database
        run: cargo audit 2>/dev/null || true

      - name: Run security audit
        run: |
          echo "Running cargo audit to check for security vulnerabilities..."
          echo "Configuration: .audit.toml"
          echo ""
          set +e
          cargo audit 2>&1 | tee audit-output.txt
          AUDIT_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "=== Security Audit Summary ==="
          echo "Exit code: ${AUDIT_EXIT_CODE:-0}"
          if [ "${AUDIT_EXIT_CODE:-0}" -ne 0 ]; then
            echo "Security vulnerabilities detected! Review the output above."
          else
            echo "No security vulnerabilities found!"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cargo-audit-results
          path: |
            dev-repo/audit-output.txt
            dev-repo/SecurityVulnerabilities.md
          if-no-files-found: ignore

  deny:
    name: License & Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev-repo
          shared-key: security-deny

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny checks
        run: |
          echo "=== Running cargo-deny checks ==="
          cargo deny check licenses bans advisories sources

      - name: Upload deny report
        if: always()
        run: cargo deny report --format html > deny-report.html || true

      - name: Upload deny report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cargo-deny-report
          path: dev-repo/deny-report.html
          if-no-files-found: ignore
