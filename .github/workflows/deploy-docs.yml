name: Deploy Documentation to GitHub Pages

# Runs on the release repo; checks out source from the private dev repo via PAT,
# then publishes dev-repo docs to GitHub Pages (Pages must be enabled on this repo).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Dev-repo branch/tag to deploy docs from"
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DEV_REPO: luengnat/rustycode

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Copy docs to site root
        working-directory: dev-repo
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp README.md _site/index.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev-repo/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
