name: Tests

# Runs the dev repo's test suite on the three desktop platforms. The release
# matrix is compile-only; this workflow is the only cross-platform test gate.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Dev-repo branch/tag to test"
        default: "main"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  DEV_REPO: luengnat/rustycode

defaults:
  run:
    working-directory: dev-repo

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux runners have Docker: run the full suite incl. bench.
            # tauri is excluded everywhere: zero tests, drags GTK/WebKit
            # system deps that the rest of the workspace never needs.
            test_args: --workspace --all-targets --locked --exclude rustycode-tauri
          - os: macos-latest
            # bench/swebench assume a Linux/Docker environment.
            test_args: --workspace --all-targets --locked --exclude rustycode-bench --exclude rustycode-tauri
          - os: windows-latest
            test_args: --workspace --all-targets --locked --exclude rustycode-bench --exclude rustycode-tauri

    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEV_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: dev-repo
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          protobuf-compiler pkg-config libssl-dev
          libxtst-dev libx11-dev libxdo-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libxkbcommon-dev
          libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libdbus-1-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf openssl

      - name: Install Windows system dependencies (protoc)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v29.5/protoc-29.5-win64.zip"
          Invoke-WebRequest -Uri $protocUrl -OutFile protoc.zip
          Expand-Archive -Path protoc.zip -DestinationPath C:\protoc
          echo "C:\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          C:\protoc\bin\protoc.exe --version

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.os }}
          workspaces: dev-repo

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@rustycode.local"
          git config --global user.name "RustyCode CI"
          git config --global commit.gpgsign false
          git config --global init.defaultBranch main

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --no-fail-fast ${{ matrix.test_args }} -- --nocapture

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo test --no-fail-fast ${{ matrix.test_args }}
