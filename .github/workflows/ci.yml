name: CI

on:
  repository_dispatch:
    types: [trigger-ci]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check'
        required: true
        default: 'main'

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout from private repo
        uses: actions/checkout@v4
        with:
          repository: luengnat/rustycode
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Run tests
        run: cargo test --workspace

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout from private repo
        uses: actions/checkout@v4
        with:
          repository: luengnat/rustycode
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout from private repo
        uses: actions/checkout@v4
        with:
          repository: luengnat/rustycode
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
