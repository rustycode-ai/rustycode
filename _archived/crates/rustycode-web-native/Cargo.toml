[package]
name = "rustycode-web-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rustycode-ui-model = { path = "../rustycode-ui-model" }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
